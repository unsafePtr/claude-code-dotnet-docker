name: check-claude-update

# Daily check for a new Claude Code release. If downloads.claude.ai reports a
# version newer than the one pinned in the Dockerfile, build and publish the
# image for that version, then commit the version bump to main so the repo
# records exactly what was shipped. If the pinned version already matches the
# latest, this no-ops: no build, no commit, no new image.
#
# Order is build-then-commit: a failed build leaves git and the registry
# consistent (both still on the old version) rather than drifting.

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      latest: ${{ steps.ver.outputs.latest }}
      current: ${{ steps.ver.outputs.current }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve versions
        id: ver
        run: |
          latest=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          current=$(grep -oP 'ARG CLAUDE_CODE_VERSION=\K.*' Dockerfile)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date on $current; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Update available: $current -> $latest"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.latest }}
    secrets: inherit

  commit:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Bump pinned version and push
        run: |
          sed -i "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=${{ needs.check.outputs.latest }}/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump Claude Code to ${{ needs.check.outputs.latest }}"
          git push
