name: build

# Reusable build/push of the image, parameterized by the Claude Code version.
# Called by docker.yml (manual tag releases) and check-claude-update.yml
# (automated daily releases). The version is passed as a build-arg so the
# image content is decoupled from whatever the checked-out Dockerfile pins.

on:
  workflow_call:
    inputs:
      version:
        description: Claude Code version to build and tag (e.g. 2.1.159)
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/claude-code-dotnet-docker
            ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

      # Build once into the local daemon and smoke-test the real image before
      # publishing. Gates both the automated and manual release paths so a
      # broken image (bad Claude binary, failed dotnet tool install, etc.)
      # never gets pushed. Single-platform (amd64) is fine — that's what the
      # push step builds too.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: claude-code-dotnet:smoke-test
          build-args: |
            CLAUDE_CODE_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          img=claude-code-dotnet:smoke-test
          echo "== claude --version =="
          claude_ver=$(docker run --rm "$img" claude --version)
          echo "$claude_ver"
          echo "$claude_ver" | grep -q "${{ inputs.version }}" \
            || { echo "::error::claude --version did not report ${{ inputs.version }}"; exit 1; }
          echo "== dotnet --version =="
          docker run --rm "$img" dotnet --version
          echo "== dotnet global tools =="
          docker run --rm "$img" dotnet tool list --global

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Resolve repo description
        id: desc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "text=$(gh api repos/${{ github.repository }} --jq '.description // ""')" >> "$GITHUB_OUTPUT"

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/claude-code-dotnet-docker
          short-description: ${{ steps.desc.outputs.text }}
